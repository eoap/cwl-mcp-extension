name: Validate Examples

on:
  push:
  pull_request:

jobs:
  validate-cwl:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Validate example CWL files
        run: python scripts/validate_with_mcp_schema.py examples/*.cwl

  validate-expected-mcp:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install TypeScript
        run: npm install

      - name: Download MCP 2026-07-28 schema.ts
        run: |
          mkdir -p vendor/modelcontextprotocol/2026-07-28
          curl -fsSL \
            https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/main/schema/2026-07-28/schema.ts \
            -o vendor/modelcontextprotocol/2026-07-28/schema.ts

      - name: Validate expected MCP Tool JSON against official schema.ts
        run: npx tsc -p tsconfig.expected.json
